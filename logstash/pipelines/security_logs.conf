input {
  file {
    path => "/uploads/*"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  if [message] =~ /^timestamp,event_type/ {
    drop
  }

  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
  } else {
    csv {
      separator => ","
      columns => ["timestamp", "event_type", "username", "source_ip", "auth_result", "resource_accessed", "country", "severity"]
    }
  }

  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  mutate {
    add_field => { "source_system" => "security_logs" }
    remove_field => ["host", "path"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "security-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => json }
}
