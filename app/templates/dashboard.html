{% extends "base.html" %}

{% block title %}Dashboard - Security Logs{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Stats Cards -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <h5 class="card-title">Total Logs</h5>
                    <p class="card-text h3" id="total_logs">-</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-info text-white">
                <div class="card-body">
                    <h5 class="card-title">Today</h5>
                    <p class="card-text h3" id="today_logs">-</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-danger text-white">
                <div class="card-body">
                    <h5 class="card-title">Errors</h5>
                    <p class="card-text h3" id="error_logs">-</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Section -->
    <div class="card bg-secondary text-light mb-4">
        <div class="card-header">
            <h5>🔍 Search Logs</h5>
        </div>
        <div class="card-body">
            <form id="search-form" class="row g-3">
                <div class="col-md-7">
                    <input type="text" 
                           id="search_term" 
                           class="form-control" 
                           placeholder="Search by message, event type, username...">
                </div>
                <div class="col-md-3">
                    <select id="log_level" class="form-select">
                        <option value="">Level (all)</option>
                        <option>INFO</option>
                        <option>WARNING</option>
                        <option>ERROR</option>
                        <option>CRITICAL</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Search</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Results Table -->
    <div class="card bg-secondary text-light">
        <div class="card-header">
            <h5>📊 Results</h5>
        </div>
        <div class="card-body">
            <table class="table table-dark table-striped table-hover">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Event</th>
                        <th>User</th>
                        <th>IP</th>
                        <th>Severity</th>
                    </tr>
                </thead>
                <tbody id="results-tbody">
                    <tr>
                        <td colspan="5" class="text-center text-muted">No results yet</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function loadStats() {
        try {
            const r = await fetch("/api/stats");
            const d = await r.json();
            document.getElementById("total_logs").textContent = d.total_logs.toLocaleString();
            document.getElementById("today_logs").textContent = d.today_logs.toLocaleString();
            document.getElementById("error_logs").textContent = d.error_logs.toLocaleString();
        } catch (e) {
            console.error("Error loading stats:", e);
        }
    }

    async function search(e) {
        e.preventDefault();
        const q = document.getElementById("search_term").value;
        const level = document.getElementById("log_level").value;
        
        let url = `/api/search?q=${encodeURIComponent(q)}`;
        if(level) url += `&level=${level}`;
        
        try {
            const r = await fetch(url);
            const d = await r.json();
            const tbody = document.getElementById("results-tbody");
            tbody.innerHTML = "";
            
            if(d.logs && d.logs.length > 0) {
                d.logs.forEach(log => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${log["@timestamp"] || "-"}</td>
                        <td>${log.event_type || "-"}</td>
                        <td>${log.username || "-"}</td>
                        <td>${log.source_ip || "-"}</td>
                        <td><span class="badge bg-danger">${log.severity || "INFO"}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No logs found</td></tr>';
            }
        } catch (e) {
            console.error("Search error:", e);
        }
    }

    document.getElementById("search-form").addEventListener("submit", search);
    loadStats();
</script>
{% endblock %}
